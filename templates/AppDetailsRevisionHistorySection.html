<table class="data">
	<tr>
		<th colspan="3">Revision History</th>
	</tr>
	<tr>
		<th>Person</th>
		<th>Date</th>
		<th>Revision</th>
	</tr>
	{foreach from=$revisions item=row}
	<tr>	
		<td nowrap>{$row.user_id|userInfoPopup}</td>
		<td nowrap align=\"center\">{$row.revision_date|date_format:"%D %T"} GMT
		</td>
		<td>&nbsp;{$row.revision}</td>
		</tr>
	{/foreach}
</table>
